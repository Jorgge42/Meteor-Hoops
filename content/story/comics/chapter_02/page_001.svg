<text x="110" y="155" fill="#86efac" font-size="34" font-family="sans-serif" font-weight="700">CAPÍTULO 2 • RAÍZES EM MOVIMENTO</text>
<text x="110" y="270" fill="#f0fdf4" font-size="70" font-family="sans-serif" font-weight="900">A FLORESTA NÃO FICA PARADA.</text>
<text x="110" y="365" fill="#d1fae5" font-size="34" font-family="sans-serif">Depois da estreia, a Vale Fóssil recebe o primeiro convite para jogar fora de casa.</text>
<text x="110" y="420" fill="#d1fae5" font-size="34" font-family="sans-serif">O Canopy Institute joga sem posições fixas: corta, troca, passa e some entre as árvores.</text>
<path d="M1110 660 C1150 390,1300 470,1370 230 M1180 700 C1200 500,1070 460,1020 330 M1280 690 C1260 530,1390 500,1450 390" fill="none" stroke="#22c55e" stroke-width="28" stroke-linecap="round" opacity="0.75"/>
<text x="110" y="760" fill="#86efac" font-size="29" font-family="sans-serif">Luma: “Se tentarmos marcar nomes, vamos nos perder. Temos que marcar espaços.”</text>
