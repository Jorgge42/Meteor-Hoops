<text x="110" y="285" fill="#ffffff" font-size="75" font-family="sans-serif" font-weight="900">A BOLA COMEÇA A FALAR.</text>
<text x="110" y="380" fill="#d1fae5" font-size="34" font-family="sans-serif">Kiro percebe que velocidade não é correr o tempo todo.</text>
<text x="110" y="435" fill="#d1fae5" font-size="34" font-family="sans-serif">Às vezes, acelerar significa passar antes que a defesa entenda o que aconteceu.</text>
