<text x="80" y="245" font-family="sans-serif" font-size="40" font-weight="700" fill="#f8fafc">COMPOSTURA SILENCIA A ARENA.</text>
<text x="80" y="338" font-family="sans-serif" font-size="26" fill="#dce4ee">Misture passe, finta, bloqueio, infiltração, proteção e arremesso.</text>
<text x="80" y="380" font-family="sans-serif" font-size="26" fill="#dce4ee">Cuide da posse e termine a defesa com o rebote. Repetir-se quebra a corrente.</text>
<text x="80" y="422" font-family="sans-serif" font-size="26" fill="#dce4ee">Encha Compostura para criar o Silêncio da Vale e atrasar novos planos.</text>
