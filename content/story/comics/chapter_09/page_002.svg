<text x="80" y="100" font-family="sans-serif" font-size="28" fill="#fde047">CAPÍTULO 09 • O RUGIDO</text>
<text x="80" y="155" font-family="sans-serif" font-size="19" fill="#8b93a7">PÁGINA 2</text>
<text x="80" y="245" font-family="sans-serif" font-size="40" font-weight="700" fill="#f8fafc">O PLANO SEMPRE APARECE.</text>
<text x="80" y="338" font-family="sans-serif" font-size="26" fill="#dce4ee">Pressão na bola. Troca total. Parede no garrafão. Controle do rebote.</text>
<text x="80" y="380" font-family="sans-serif" font-size="26" fill="#dce4ee">A Vale verá a chamada no HUD antes de sentir a rotação.</text>
<text x="80" y="422" font-family="sans-serif" font-size="26" fill="#dce4ee">O Rugido acelera decisões coletivas — nunca o arremesso ou a física.</text>
<text x="1120" y="660" font-family="sans-serif" font-size="24" fill="#fde047">☄ 09</text>
