<text x="80" y="100" font-family="sans-serif" font-size="28" fill="#fde047">CAPÍTULO 09 • O RUGIDO</text>
<text x="80" y="155" font-family="sans-serif" font-size="19" fill="#8b93a7">PÁGINA 1</text>
<text x="80" y="245" font-family="sans-serif" font-size="40" font-weight="700" fill="#f8fafc">A SEMIFINAL TEM SOM DE TROVÃO.</text>
<text x="80" y="338" font-family="sans-serif" font-size="26" fill="#dce4ee">Cada bloqueio, rebote e parada da Apex levanta o ginásio inteiro.</text>
<text x="80" y="380" font-family="sans-serif" font-size="26" fill="#dce4ee">Rexon ergue uma garra. Cinco atletas respondem como um só time.</text>
<text x="80" y="422" font-family="sans-serif" font-size="26" fill="#dce4ee">Não é apenas força. É força com um plano.</text>
<text x="1120" y="660" font-family="sans-serif" font-size="24" fill="#fde047">☄ 09</text>
