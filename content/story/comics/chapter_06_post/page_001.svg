<text x="80" y="100" font-family="sans-serif" font-size="28" fill="#d4c4ae">CAPÍTULO 06 • DEPOIS DA PAREDE</text>
<text x="80" y="155" font-family="sans-serif" font-size="19" fill="#8da4b8">PÁGINA 1</text>
<text x="80" y="255" font-family="sans-serif" font-size="40" font-weight="700" fill="#f5fbff">A PAREDE NÃO CAIU. ELES APRENDERAM A CONTORNÁ-LA.</text>
<text x="80" y="350" font-family="sans-serif" font-size="26" fill="#c8d9e8">No fim, o bloqueio de Bato abre o corredor. Kiro gira pela tela, a</text>
<text x="80" y="392" font-family="sans-serif" font-size="26" fill="#c8d9e8">defesa fecha e a bola encontra Luma livre. Não foi força contra força.</text>
<text x="80" y="434" font-family="sans-serif" font-size="26" fill="#c8d9e8">Foi força usada com inteligência.</text>
