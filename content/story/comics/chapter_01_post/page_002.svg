<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#090b13"/>
<rect x="70" y="70" width="1460" height="760" rx="28" fill="#1d1729" stroke="#a855f7" stroke-width="6"/>
<text x="110" y="155" fill="#c084fc" font-size="34" font-family="sans-serif" font-weight="700">ARQUIBANCADA VAZIA • MINUTOS DEPOIS</text>
<text x="110" y="295" fill="#f9fafb" font-size="68" font-family="sans-serif" font-weight="900">ALGUÉM ESTAVA ASSISTINDO.</text>
<text x="110" y="390" fill="#d1d5db" font-size="34" font-family="sans-serif">No alto do ginásio, uma silhueta fecha o tablet com as estatísticas de Kiro.</text>
<text x="110" y="450" fill="#d1d5db" font-size="34" font-family="sans-serif">No uniforme, o brasão dourado da Tyrant Crown Academy.</text>
<text x="110" y="560" fill="#fb7185" font-size="42" font-family="sans-serif" font-weight="700">DRAX: “Rápido. Mas ainda previsível.”</text>
<text x="110" y="735" fill="#9ca3af" font-size="26" font-family="sans-serif">Primeira aparição indireta do rival da final.</text>
</svg>
