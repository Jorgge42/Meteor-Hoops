<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#0d131b"/>
<rect x="70" y="70" width="1460" height="760" rx="28" fill="#182331" stroke="#f59e0b" stroke-width="6"/>
<text x="110" y="155" fill="#f59e0b" font-size="34" font-family="sans-serif" font-weight="700">ROTA DO METEORO • PRÓXIMA PARADA</text>
<text x="110" y="290" fill="#f9fafb" font-size="76" font-family="sans-serif" font-weight="900">JOGO 2 DESBLOQUEADO</text>
<text x="110" y="390" fill="#d1d5db" font-size="36" font-family="sans-serif">A vitória coloca a Vale Fóssil oficialmente no mapa da liga escolar.</text>
<text x="110" y="455" fill="#d1d5db" font-size="36" font-family="sans-serif">O próximo adversário será construído na próxima etapa do protótipo.</text>
<text x="110" y="560" fill="#34d399" font-size="42" font-family="sans-serif" font-weight="700">NOVO: TREINO LIVRE DESBLOQUEADO</text>
<text x="110" y="735" fill="#9ca3af" font-size="26" font-family="sans-serif">Meta narrativa: cada vitória acrescenta uma peça ao caminho até o Troféu Meteoro.</text>
</svg>
