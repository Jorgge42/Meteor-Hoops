<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#111827"/>
<rect x="70" y="70" width="1460" height="760" rx="28" fill="#172033" stroke="#38bdf8" stroke-width="6"/>
<text x="110" y="160" fill="#38bdf8" font-size="34" font-family="sans-serif" font-weight="700">LIGA DO METEORO • JOGO 1</text>
<text x="110" y="300" fill="#f9fafb" font-size="82" font-family="sans-serif" font-weight="900">QUARTZ ACADEMY</text>
<text x="110" y="385" fill="#d1d5db" font-size="36" font-family="sans-serif">Primeiro adversário. Nenhum truque. Só fundamentos.</text>
<text x="110" y="470" fill="#fbbf24" font-size="38" font-family="sans-serif" font-weight="700">OBJETIVO DO JOGO 1</text>
<text x="110" y="525" fill="#e5e7eb" font-size="32" font-family="sans-serif">Aprenda a mover, correr, passar, pegar a bola e controlar o timing do arremesso.</text>
<text x="110" y="615" fill="#e5e7eb" font-size="32" font-family="sans-serif">Agora é oficial: 2 tempos, relógio de posse, banco e uma vaga na Rota do Meteoro.</text>
<text x="110" y="735" fill="#9ca3af" font-size="26" font-family="sans-serif">Clique em PRÓXIMA para entrar em quadra.</text>
</svg>
