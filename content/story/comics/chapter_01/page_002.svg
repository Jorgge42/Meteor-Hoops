<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#0b0f19"/>
<rect x="70" y="70" width="1460" height="760" rx="28" fill="#202634" stroke="#ef4444" stroke-width="6"/>
<text x="110" y="165" fill="#ef4444" font-size="34" font-family="sans-serif" font-weight="700">TREINO • FIM DE TARDE</text>
<text x="110" y="320" fill="#f9fafb" font-size="64" font-family="sans-serif" font-weight="800">“VELOCIDADE NÃO É DIREÇÃO.”</text>
<text x="110" y="390" fill="#d1d5db" font-size="34" font-family="sans-serif">Coach Argus não se impressiona com o primeiro drible de Kiro.</text>
<text x="110" y="445" fill="#d1d5db" font-size="34" font-family="sans-serif">Ele aponta para os outros dois jogadores.</text>
<text x="110" y="530" fill="#fbbf24" font-size="42" font-family="sans-serif" font-weight="700">“Aqui a bola corre mais rápido que qualquer raptor.”</text>
<text x="110" y="735" fill="#9ca3af" font-size="26" font-family="sans-serif">A fala define a mecânica do capítulo: passar antes de acelerar.</text>
</svg>
