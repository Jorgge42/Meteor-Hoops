<text x="80" y="100" font-family="sans-serif" font-size="28" fill="#a79cff">CAPÍTULO 07 • DEPOIS DO ECLIPSE</text>
<text x="80" y="155" font-family="sans-serif" font-size="19" fill="#71839f">PÁGINA 1</text>
<text x="80" y="255" font-family="sans-serif" font-size="40" font-weight="700" fill="#f5fbff">AS LUZES VOLTAM. A QUADRA PARECE MAIOR.</text>
<text x="80" y="350" font-family="sans-serif" font-size="26" fill="#c8d9e8">A última sirene atravessa o ginásio. Nyx sorri: a Vale Fóssil não</text>
<text x="80" y="392" font-family="sans-serif" font-size="26" fill="#c8d9e8">parou de errar, mas deixou de oferecer o mesmo erro duas vezes.</text>
<text x="80" y="434" font-family="sans-serif" font-size="26" fill="#c8d9e8">A sombra perdeu quando já não sabia qual resposta era verdadeira.</text>
<text x="1120" y="660" font-family="sans-serif" font-size="24" fill="#a79cff">☄ 07</text>
</svg>
