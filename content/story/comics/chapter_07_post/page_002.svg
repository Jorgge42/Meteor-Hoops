<text x="80" y="100" font-family="sans-serif" font-size="28" fill="#a79cff">CAPÍTULO 07 • DEPOIS DO ECLIPSE</text>
<text x="80" y="155" font-family="sans-serif" font-size="19" fill="#71839f">PÁGINA 2</text>
<text x="80" y="255" font-family="sans-serif" font-size="35" font-weight="700" fill="#f5fbff">FINTAR NÃO É MENTIR. É CRIAR UMA SEGUNDA VERDADE.</text>
<text x="80" y="350" font-family="sans-serif" font-size="26" fill="#c8d9e8">Kiro registra a lição: o passe começa nos olhos, passa pelos ombros</text>
<text x="80" y="392" font-family="sans-serif" font-size="26" fill="#c8d9e8">e só então chega às mãos. A próxima decisão pode esconder a seguinte.</text>
<text x="80" y="434" font-family="sans-serif" font-size="26" fill="#c8d9e8">Agora a equipe sabe jogar contra quem tenta prever o futuro.</text>
<text x="1120" y="660" font-family="sans-serif" font-size="24" fill="#a79cff">☄ 07</text>
