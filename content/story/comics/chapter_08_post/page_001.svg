<text x="80" y="100" font-family="sans-serif" font-size="28" fill="#5eead4">CAPÍTULO 08 • FORA DA CURVA</text>
<text x="80" y="155" font-family="sans-serif" font-size="19" fill="#71839f">PÁGINA 1</text>
<text x="80" y="245" font-family="sans-serif" font-size="39" font-weight="700" fill="#f5fbff">O ÚLTIMO CÁLCULO TERMINA EM ERRO.</text>
<text x="80" y="350" font-family="sans-serif" font-size="26" fill="#c8d9e8">O placar marca vitória. A projeção previa passe, mas Kiro recusou o</text>
<text x="80" y="392" font-family="sans-serif" font-size="26" fill="#c8d9e8">bloqueio e atacou o lado vazio. Não foi sorte: ele viu o modelo,</text>
<text x="80" y="434" font-family="sans-serif" font-size="26" fill="#c8d9e8">entendeu sua resposta e criou uma terceira opção.</text>
<text x="1120" y="660" font-family="sans-serif" font-size="24" fill="#fbbf24">☄ 08</text>
