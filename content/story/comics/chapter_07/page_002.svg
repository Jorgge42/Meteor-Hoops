<text x="80" y="100" font-family="sans-serif" font-size="28" fill="#8f83ff">CAPÍTULO 07 • LUZES APAGADAS</text>
<text x="80" y="155" font-family="sans-serif" font-size="19" fill="#71839f">PÁGINA 2</text>
<text x="80" y="255" font-family="sans-serif" font-size="40" font-weight="700" fill="#f5fbff">“O ROUBO ACONTECE UM SEGUNDO ANTES DO TOQUE.”</text>
<text x="80" y="350" font-family="sans-serif" font-size="26" fill="#c8d9e8">Nyx aponta para a linha entre Kiro e Luma. Shade já está nela.</text>
<text x="80" y="392" font-family="sans-serif" font-size="26" fill="#c8d9e8">A capitã explica: repetir uma resposta transforma escolha em hábito.</text>
<text x="80" y="434" font-family="sans-serif" font-size="26" fill="#c8d9e8">E hábito é uma jogada que o adversário pode enxergar.</text>
<text x="1120" y="660" font-family="sans-serif" font-size="24" fill="#8f83ff">☄ 07</text>
</svg>
