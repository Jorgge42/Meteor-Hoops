<text x="80" y="255" font-family="sans-serif" font-size="40" font-weight="700" fill="#f5fbff">O GINÁSIO APAGA ANTES DO PRIMEIRO PASSE.</text>
<text x="80" y="350" font-family="sans-serif" font-size="26" fill="#c8d9e8">Linhas violetas surgem no chão. Olhos acompanham cada movimento.</text>
<text x="80" y="392" font-family="sans-serif" font-size="26" fill="#c8d9e8">A Nightclaw não corre atrás da bola: ocupa o lugar para onde ela</text>
