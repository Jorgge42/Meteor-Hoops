<text x="80" y="100" font-family="sans-serif" font-size="28" fill="#fde047">CAPÍTULO 09 • DEPOIS DO RUGIDO</text>
<text x="80" y="155" font-family="sans-serif" font-size="19" fill="#8b93a7">PÁGINA 2</text>
<text x="80" y="245" font-family="sans-serif" font-size="40" font-weight="700" fill="#f8fafc">REXON ABAIXA A GARRA.</text>
<text x="80" y="338" font-family="sans-serif" font-size="26" fill="#dce4ee">“Força sem leitura é só peso”, admite o capitão da Dominion.</text>
<text x="80" y="380" font-family="sans-serif" font-size="26" fill="#dce4ee">“Vocês não venceram três duelos. Venceram o nosso plano.”</text>
<text x="80" y="422" font-family="sans-serif" font-size="26" fill="#dce4ee">No mapa, a última rota se acende em vermelho.</text>
<text x="1120" y="660" font-family="sans-serif" font-size="24" fill="#fde047">☄ 10</text>
