<text x="80" y="245" font-family="sans-serif" font-size="40" font-weight="700" fill="#f8fafc">TRÊS PASSES. UM REBOTE. SILÊNCIO.</text>
<text x="80" y="338" font-family="sans-serif" font-size="26" fill="#dce4ee">A Vale não tentou superar o barulho. Jogou através dele.</text>
