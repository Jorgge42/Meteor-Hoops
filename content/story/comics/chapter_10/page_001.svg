<text x="74" y="92" font-family="sans-serif" font-size="28" fill="#ff8067">CAPÍTULO 10 • O METEORO</text>
<text x="74" y="142" font-family="sans-serif" font-size="19" fill="#9ba5b7">PÁGINA 1</text>
<text x="74" y="235" font-family="sans-serif" font-size="42" font-weight="700" fill="#fff7f3">A ÚLTIMA QUADRA TEM UM TRONO.</text>
<text x="74" y="326" font-family="sans-serif" font-size="26" fill="#e5e7eb">A arena da Tyrant Crown foi construída para uma única certeza:</text>
<text x="74" y="370" font-family="sans-serif" font-size="26" fill="#e5e7eb">Drax sempre sabe qual arma o adversário usará em seguida.</text>
<text x="74" y="414" font-family="sans-serif" font-size="26" fill="#ffb19e">Hoje, a Vale Fóssil veio provar que certeza também quebra.</text>
<text x="1160" y="670" text-anchor="end" font-family="sans-serif" font-size="23" fill="#ff8067">10 • 01</text>
