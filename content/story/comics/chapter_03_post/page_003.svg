<text x="70" y="88" font-size="24" font-family="sans-serif" fill="#dc2626" font-weight="700">TYRANT CROWN ACADEMY</text><text x="70" y="158" font-size="46" font-family="sans-serif" fill="#f7f8fb" font-weight="800">DRAX MARCA O TERCEIRO PONTO.</text><text x="70" y="228" font-size="25" font-family="sans-serif" fill="#d5dbe6">Três círculos riscados aparecem no quadro de Drax.</text><text x="70" y="270" font-size="25" font-family="sans-serif" fill="#d5dbe6">Ao lado do décimo, ele desenha um pequeno meteoro.</text><text x="70" y="312" font-size="25" font-family="sans-serif" fill="#d5dbe6">“Ainda falta aprender a perder o controle.”</text>
