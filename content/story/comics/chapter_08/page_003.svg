<text x="80" y="155" font-family="sans-serif" font-size="19" fill="#71839f">PÁGINA 3</text>
<text x="80" y="245" font-family="sans-serif" font-size="38" font-weight="700" fill="#f5fbff">PARA SAIR DA CURVA, É PRECISO ESCOLHER.</text>
<text x="80" y="350" font-family="sans-serif" font-size="26" fill="#c8d9e8">Luma recusa jogar ao acaso. Ela propõe algo mais difícil: mostrar uma</text>
