<g fill="#5eead4" opacity="0.75"><circle cx="365" cy="455" r="10"/><circle cx="530" cy="390" r="10"/><circle cx="745" cy="300" r="10"/><circle cx="1000" cy="245" r="10"/></g>
<text x="80" y="100" font-family="sans-serif" font-size="28" fill="#42d5c5">CAPÍTULO 08 • O JOGO DOS DADOS</text>
<text x="80" y="155" font-family="sans-serif" font-size="19" fill="#71839f">PÁGINA 1</text>
<text x="80" y="245" font-family="sans-serif" font-size="39" font-weight="700" fill="#f5fbff">A QUADRA PARECE UM LABORATÓRIO.</text>
<text x="80" y="330" font-family="sans-serif" font-size="26" fill="#c8d9e8">Setas, porcentagens e mapas de calor acompanham cada passo da Vale.</text>
<text x="80" y="372" font-family="sans-serif" font-size="26" fill="#c8d9e8">A Fossil Tech não promete adivinhar. Ela mede o que costuma acontecer</text>
<text x="80" y="414" font-family="sans-serif" font-size="26" fill="#c8d9e8">depois de cada escolha — e posiciona a resposta antes do passe.</text>
<text x="1120" y="660" font-family="sans-serif" font-size="24" fill="#42d5c5">☄ 08</text>
</svg>
