name: Godot validation

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Import, contracts and boot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Show engine version
        run: godot --version

      - name: Validate repository resources
        run: python3 tools/validate_project.py

      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          ! grep -E "SCRIPT ERROR|ERROR: Failed to load script" /tmp/godot-import.log

      - name: Run AI contracts
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_ai_contracts.gd 2>&1 | tee /tmp/godot-contracts.log
          ! grep -E "SCRIPT ERROR|ERROR: Failed to load script" /tmp/godot-contracts.log

      - name: Boot main scene
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-boot.log
          ! grep -E "SCRIPT ERROR|ERROR: Failed to load script" /tmp/godot-boot.log
